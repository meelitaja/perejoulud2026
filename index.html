<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Jõulud 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Pinyon+Script&display=swap">
<style>
/* Layout: phone-first column under a midnight hero band with garland lights; pearl + champagne + fir below (matches the Jõulud 2026 planner). Single light look. */
:root{
  --night:#F5F0E7; --pine:#FBF8F1; --pine-2:#DCE5DD; --line:rgba(198,170,120,.45); --track:#EAE3D3;
  --gold:#193C32; --gold-soft:#2e5546; --cran:#692C38; --snow:#14213D; --mist:#4a4f60;
  --champ:#C6AA78; --midnight:#0d1730; --midnight-2:#1a2a52; --pearl:#F5F0E7;
  --display:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --label:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --script:"Pinyon Script","Snell Roundhand","Brush Script MT",cursive;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{background:var(--night);color:var(--snow)}
body{font-family:var(--body);font-size:17px;line-height:1.5;min-height:100%}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}

.hero{position:relative;overflow:hidden;isolation:isolate;text-align:center;color:var(--pearl);
  margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));margin-top:-10px;padding:58px 20px 30px;
  background:radial-gradient(120% 80% at 50% 0%,var(--midnight-2),var(--midnight) 75%);display:flex;flex-direction:column;align-items:center;gap:6px}
@media (min-width:600px){.hero{margin-inline:0;border-radius:0 0 24px 24px}}
.garland{position:absolute;top:0;left:0;width:100%;height:50px;z-index:-1}
.garland circle{animation:tw 2.6s ease-in-out infinite}
.hero .kicker{font-family:var(--label);font-size:.64rem;letter-spacing:.34em;text-transform:uppercase;color:var(--champ)}
.hero h1{font-size:clamp(2.1rem,9vw,2.9rem);letter-spacing:.2em;padding-left:.2em;text-transform:uppercase;line-height:1;color:var(--pearl)}
.hero .script{font-family:var(--script);font-size:1.8rem;color:var(--champ);line-height:1.1}
.hero .snow{position:absolute;inset:0;z-index:-1;opacity:.5;background-image:radial-gradient(1.5px 1.5px at 12% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 28% 70%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 46% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 63% 58%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 81% 34%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 90% 76%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 6% 82%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 38% 88%,#fff 50%,transparent 51%)}
.hero #modechip{margin-top:10px}
.hero .chip{color:var(--champ);border-color:rgba(198,170,120,.5)}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 130px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--label);font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:500}
.chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mist);white-space:nowrap}

.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--midnight);background:var(--midnight);color:var(--pearl)!important;border-radius:999px;padding:10px 16px;font-size:17px;font-weight:600;color:var(--mist);cursor:pointer;display:flex;gap:6px;align-items:center}
.tab[aria-current="page"]{background:var(--champ);color:var(--midnight)!important;border-color:var(--champ)}
.tab:hover{border-color:var(--champ)}
.tab .live{width:7px;height:7px;border-radius:50%;background:var(--cran);box-shadow:0 0 0 3px rgba(201,65,79,.25)}

main{display:flex;flex-direction:column;gap:14px}
.card{background:var(--pine);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 22px rgba(13,23,48,.06);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:2.05rem;line-height:1.1}
.card h3{font-size:1.35rem}
.muted{color:var(--mist);font-size:16px}
.note{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--mist);font-size:14px}
.note.warn{border-color:var(--cran);color:var(--snow)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

.btn{border:0;border-radius:12px;padding:14px 18px;font-size:17px;font-weight:700;background:var(--gold);color:var(--night);cursor:pointer;text-align:center}
.btn:hover{background:var(--gold-soft)}
.btn.ghost{background:transparent;color:var(--snow);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold)}
.btn.red{background:var(--cran);color:var(--pearl)}
.btn.sm{padding:11px 15px;font-size:16px;border-radius:11px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}

label.f{display:flex;flex-direction:column;gap:8px;font-size:17px;font-weight:600}
input[type=text],textarea{width:100%;background:var(--night);border:1px solid transparent;border-radius:10px;padding:13px 14px;font-size:18px;border-color:var(--line)}
textarea{resize:vertical;min-height:64px}
input::placeholder,textarea::placeholder{color:#9a9aa6}
label.f{font-family:var(--body)}

.bb{--h:var(--cran);flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;position:relative;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.6),transparent 38%),var(--h);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.bb::before{content:"";position:absolute;top:-5px;left:50%;width:10px;height:6px;transform:translateX(-50%);background:var(--champ);border-radius:2px 2px 1px 1px}
.bb.lg{width:76px;height:76px;font-size:30px}
.bb.lg::before{width:18px;height:10px;top:-9px}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px 8px}
.pl{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;text-align:center;position:relative;min-width:0}
.pl span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .x{position:absolute;top:-6px;right:8px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--night);color:var(--mist);font-size:13px;line-height:1;cursor:pointer}
.hues{display:flex;gap:10px;flex-wrap:wrap;padding-top:6px}
.hue{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.6),transparent 38%),var(--h)}
.hue[aria-pressed="true"]{border-color:var(--snow);box-shadow:0 0 0 2px var(--night) inset}

.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.choice{display:flex;align-items:center;gap:10px;padding:12px;font-size:17px;border-radius:12px;border:1px solid var(--line);background:var(--night);cursor:pointer;text-align:left;min-width:0;font-weight:600}
.choice span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.choice[aria-pressed="true"]{border-color:var(--gold);background:var(--pine-2);box-shadow:0 0 0 1px var(--gold) inset}
.choice.done::after{content:"✓";margin-left:auto;color:var(--gold)}

.games{display:grid;gap:10px}
.game{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--pine);cursor:pointer;text-align:left}
.game:hover{border-color:var(--gold)}
.game .n{font-family:var(--display);font-size:1.4rem;font-weight:500;line-height:1.05}
.game .num{font-variant-numeric:lining-nums;font-family:var(--display);font-size:1.8rem;color:var(--champ);width:28px;text-align:center}
.game .go{color:var(--champ);font-family:var(--display);font-size:1.6rem}

.progress{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--mist)}
.progress .track{flex:1;height:5px;border-radius:9px;background:var(--track);overflow:hidden}
.progress .fill{height:100%;background:var(--gold);border-radius:9px;transition:width .4s}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.bar .bb{width:30px;height:30px;font-size:12px}
.bar .bb::before{width:8px;height:5px;top:-4px}
.bar .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.bar .t b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:6px;border-radius:9px;background:var(--track);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--champ);border-radius:9px}
.bar .c{font-family:var(--display);font-size:1.3rem;font-variant-numeric:lining-nums tabular-nums;font-weight:600;color:var(--gold)}
.winner{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0 4px;text-align:center}
.winner .nm{font-family:var(--display);font-size:2.4rem;font-weight:500;color:var(--gold)}
.trophy{font-family:var(--label);font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--mist);font-weight:500}
.awardlist{display:flex;flex-direction:column;gap:12px;padding:0;margin:0;list-style:none}
.awardlist li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.awardlist li:last-child{border-bottom:0;padding-bottom:0}
.awardlist .q{font-size:13px;color:var(--mist)}
.awardlist .w{font-family:var(--display);font-size:19px}

.board{display:flex;flex-direction:column;gap:8px}
.slot{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--night);border:1px solid var(--line);text-align:left;min-height:52px}
.slot .r{font-family:var(--display);font-size:1.5rem;color:var(--champ);text-align:center}
.slot .a{font-weight:700;font-size:17px;min-width:0;overflow-wrap:anywhere}
.slot .c{font-variant-numeric:tabular-nums;font-weight:700;background:var(--gold);color:var(--pearl);border-radius:8px;padding:2px 9px}
.slot.hid .a{color:var(--champ);letter-spacing:.3em}
.slot.hid{background:repeating-linear-gradient(135deg,var(--night) 0 10px,#EFE8DA 10px 20px)}
button.slot{cursor:pointer;width:100%}
.slot.open{border-color:var(--gold);animation:flip .45s ease-out}
@keyframes flip{from{transform:rotateX(70deg);opacity:.2}to{transform:none;opacity:1}}

.wheelwrap{position:relative;width:min(300px,100%);aspect-ratio:1;margin:6px auto 0;max-width:100%}
#wheel{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 0 5px var(--champ),0 0 0 8px var(--pine),0 0 0 9px var(--line),0 10px 30px rgba(13,23,48,.15)}
.pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--cran);filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));z-index:2}
.hub{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:var(--pine);border:2px solid var(--champ);display:grid;place-items:center;font-family:var(--script);color:var(--gold);font-size:17px;pointer-events:none}
.result{text-align:center;padding:6px 0}
.result .big{font-family:var(--display);font-size:1.8rem;color:var(--gold);line-height:1.2}
.toastpick{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--cran)}
.toastpick{color:var(--pearl)}
.toastpick b{font-family:var(--display);font-weight:500;font-size:1.6rem}

.bingo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sq{min-height:112px;border-radius:10px;border:1px solid var(--line);background:var(--night);font-size:15px;font-weight:600;line-height:1.22;padding:8px 6px;display:grid;place-items:center;text-align:center;cursor:pointer;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.sq.long{font-size:13px}
.bingo{align-items:stretch}
.sq[aria-pressed="true"]{background:var(--cran);border-color:var(--cran);color:#fff;font-weight:600;position:relative}
.sq.line{box-shadow:0 0 0 2px var(--champ) inset}
@media (min-width:460px){.sq{font-size:17px}.sq.long{font-size:15px}}
.bingobanner{text-align:center;font-family:var(--script);font-size:2.8rem;color:var(--cran);line-height:1.1}

.seal{display:flex;gap:14px;align-items:center}
.seal .wax{flex:none;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9a4a57,var(--cran) 60%,#4a1d26);display:grid;place-items:center;font-family:var(--display);font-size:22px;color:#fbe0e3;box-shadow:0 2px 0 #3a141c}
.preds{display:flex;flex-direction:column;gap:16px}
.preds h3{font-size:1.25rem;color:var(--gold)}
.preds ul{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:8px}
.preds li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.preds li .bb{width:26px;height:26px;font-size:11px}
.preds li .bb::before{width:7px;height:4px;top:-3px}

.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qr{background:var(--snow);padding:10px;border-radius:12px;line-height:0}
.qr img,.qr canvas{display:block;width:160px;height:160px}
.linkrow{display:flex;gap:8px}
.linkrow input{flex:1;min-width:0}

.hostbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(251,248,241,.95);box-shadow:0 -6px 20px rgba(13,23,48,.08);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.hostbar .in{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:center}
.hostbar .lbl{font-size:12px;color:var(--mist);line-height:1.3;min-width:0;flex:1}
.hostbar .lbl b{display:block;color:var(--snow);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--midnight);color:var(--pearl);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.4)}

.join{padding:26px 20px;gap:16px}
.joinbb{display:flex;justify-content:center;padding-top:10px}
.bigin{text-align:center;font-size:22px!important;font-weight:700;padding:14px!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.join .btn{font-size:18px;padding:15px}
.spotgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.spotbtn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--night);font-weight:600;font-size:14px;line-height:1.2;text-align:center;cursor:pointer}
.spotbtn[aria-pressed="true"]{background:var(--gold);color:var(--night);border-color:var(--gold)}
.spotbtn .live,.tab .live{flex:none}
.spotbtn .live{width:7px;height:7px;border-radius:50%;background:var(--cran)}
.voters{display:flex;flex-wrap:wrap;gap:6px}
.vt{font-size:13px;padding:4px 10px;border-radius:999px;border:1px dashed var(--line);color:var(--mist)}
.vt.ok{border:1px solid var(--gold);color:var(--snow)}
.tablewrap{overflow-x:auto;margin-inline:-4px}
.stat{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.stat th{font-family:var(--label);font-weight:500!important;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mist);font-weight:600;text-align:center;padding:6px 4px;white-space:nowrap}
.stat th:first-child,.stat td:first-child{text-align:left}
.stat td{padding:8px 4px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
.stat .bb{width:26px;height:26px;font-size:11px}
.stat .bb::before{width:7px;height:4px;top:-3px}
.stat .ok{color:var(--gold);font-weight:700}.stat .no{color:var(--champ)}
.chip.x-swap{background:var(--gold);color:var(--night);border-color:var(--gold);cursor:pointer;font-family:var(--body)}
.mebar{gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;line-height:1.3}
.mebar.card{padding:14px}
.seg{display:flex;padding:3px;border-radius:999px;border:1px solid rgba(198,170,120,.5);background:rgba(245,240,231,.1);flex:none}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-family:var(--label);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:var(--champ);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--champ);color:var(--midnight)}
.players{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:12px 6px}
.players .bb.lg{width:44px;height:44px;font-size:17px}
.players .bb.lg::before{width:11px;height:6px;top:-5px}
.players .pl{font-size:12px;gap:5px}
.choices.compact{gap:6px}
.choices.compact .choice{padding:11px 10px;gap:9px;font-size:17px}
.choices.compact .bb{width:32px;height:32px;font-size:14px}
.choices.compact .bb::before{width:8px;height:5px;top:-4px}
.awctl{display:flex;flex-direction:column}
.awrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.awq{font-size:14px;line-height:1.35}
.presctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:10px;border-radius:16px;background:rgba(251,248,241,.94);box-shadow:0 6px 24px rgba(13,23,48,.12);z-index:5}
.presctl .btn{font-size:1rem;padding:13px 18px}
.voters.big{gap:8px}
.voters.big .vt{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;font-size:15px}
.voters.big .vt .bb{width:26px;height:26px;font-size:11px;opacity:.45}
.voters.big .vt.ok .bb{opacity:1}
.voters.big .bb::before{width:7px;height:4px;top:-3px}
.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.okmsg{background:var(--pine-2);color:var(--gold);font-weight:700;border-radius:10px;padding:10px 14px;font-size:16px}
.leader{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.leader li{display:grid;grid-template-columns:28px auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px}
.leader li.top{background:var(--pine-2)}
.leader .rk{font-family:var(--display);font-size:1.4rem;font-weight:600;color:var(--champ);text-align:right;font-variant-numeric:lining-nums}
.leader li.top .rk{color:var(--gold)}
.leader .bb{width:30px;height:30px;font-size:12px}
.leader .bb::before{width:8px;height:5px;top:-4px}
.leader .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.leader .t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leader .tr{height:6px;border-radius:9px;background:var(--track);overflow:hidden}
.leader .tr i{display:block;height:100%;background:var(--champ);border-radius:9px}
.leader .c{font-weight:700;color:var(--gold);font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stage .leader li{padding:12px 16px}
.stage .leader .rk{font-size:2rem;width:auto}
.stage .leader .bb{width:46px;height:46px;font-size:18px}
.stage .leader .t b{font-size:24px}
.stage .leader .c{font-size:22px}
.stage .leader li{grid-template-columns:44px auto minmax(0,1fr) auto}

/* ---------- storage layer ---------- */
const chains={};
function write(path,data){
  chains[path]=(chains[path]||Promise.resolve()).then(()=>data===null?db.doc(path).delete():db.doc(path).set(data)).catch(err=>{
    if(err&&err.code==="invalid_argument"){canWrite=false;render();toast("Sul pole selles mängus muutmisõigust.")}
    else if(err&&err.code==="quota_exceeded")toast("Mängu andmeruum on täis.");
    else toast("Salvestamine ei õnnestunud. Proovi uuesti.");
  });return chains[path];
}
function saveLocal(){lsSet("cc_local",JSON.stringify(S))}
function put(col,id,data){
  if(data===null)delete S[col][id];else S[col][id]=data;
  if(mode==="local"){saveLocal();render();return}
  render();write(col+"/"+id,data);
}
function setState(patch){
  S.state={...S.state,...patch};
  if(mode==="local"){saveLocal();render();return}
  render();write("game/state",S.state);
}
function onErr(e){if(e&&e.code!=="revoked")toast("Ühendus katkes. Laadi leht uuesti.")}

  try{me=await user.id()}catch(e){me=null}

  render();
}

/* ---------- game logic ---------- */
const cands=()=>guests().length?guests().map(g=>g.id):pids();
const cpl=id=>S.players[id]?id:(pids().find(p=>guestOf(p)===id)||null);
const cnm=id=>gname(id)||nm(id);
const cbb=(id,cls="")=>{const p=cpl(id);if(p)return bb(p,cls);const gi=guests().findIndex(g=>g.id===id);return`<span class="bb ${cls}" style="--h:${HUES[(gi<0?0:gi)%HUES.length]}" aria-hidden="true">${esc((cnm(id)[0]||"?").toUpperCase())}</span>`};
const voteKey=c=>{if(!c)return null;if(cands().includes(c))return c;const g=S.players[c]&&guestOf(c);return g&&cands().includes(g)?g:null};
function tally(i){const t={};for(const p of pids()){const c=voteKey(S.votes[p]?.awards?.[i]);if(c)t[c]=(t[c]||0)+1}return Object.entries(t).map(([p,n])=>({p,n})).sort((a,b)=>b.n-a.n)}
const votedAward=(p,i)=>S.votes[p]?.awards?.[i]!=null;
const norm=s=>s.toLowerCase().replace(/[.,!?;:"'„“”()]/g,"").replace(/\s+/g," ").trim();
function feudBoard(qi){
  const g={};
  for(const p of pids()){const raw=(S.feud[p]?.a||[])[qi];if(!raw||!raw.trim())continue;const k=norm(raw);if(!k)continue;
    g[k]=g[k]||{n:0,forms:{}};g[k].n++;const f=raw.trim();g[k].forms[f]=(g[k].forms[f]||0)+1}
  return Object.values(g).map(x=>({text:cap(Object.entries(x.forms).sort((a,b)=>b[1]-a[1])[0][0]),n:x.n})).sort((a,b)=>b.n-a.n||a.text.localeCompare(b.text,"et")).slice(0,6);
}
const feudDone=p=>(S.feud[p]?.a||[]).some(x=>x&&x.trim());
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const bingoItems=()=>{const l=S.state.bingoList;return Array.isArray(l)&&l.length>=9?l:BINGO};
const boardFor=p=>bingoItems().map((_,i)=>i).sort((a,b)=>hash(p+":"+S.state.seed+":"+a)-hash(p+":"+S.state.seed+":"+b)).slice(0,9);
const bingoLines=m=>LINES.filter(l=>l.every(x=>m.includes(x)));
function bingoWinner(){let w=null;for(const p of pids()){const at=S.bingo[p]?.at;if(at&&(!w||at<w.at))w={p,at}}return w}
const capDone=p=>(S.capsule[p]?.a||[]).some(x=>x&&x.trim());

const ITEMS={awards:()=>AWARDS.length+1,feud:()=>FQ().length};
function advance(k){
  const st=S.state;
  if(k==="awards"){
    if(st.idx<AWARDS.length&&st.phase==="vote")return setState({phase:"reveal"});
    if(st.idx<AWARDS.length)return setState({idx:st.idx+1,phase:"vote"});
    return;
  }
  if(k==="feud"){const q=st.fq||0;if(q<FQ().length-1)setState({fq:q+1,shown:[]})}
}
function back(k){
  const st=S.state;
  if(k==="awards"){
    if(st.idx<AWARDS.length&&st.phase==="reveal")return setState({phase:"vote"});
    if(st.idx>0)return setState({idx:st.idx-1,phase:"reveal"});
    return;
  }
  if(k==="feud"){const q=st.fq||0;if(q>0)setState({fq:q-1,shown:[]})}
}
function spotlight(k){setState({round:k,idx:0,phase:"vote",shown:[]})}

async function resetGame(){
  ui.confirm=null;
  const keep={guests:S.state.guests,bingoList:S.state.bingoList,feudList:S.state.feudList,info:S.state.info};
  const st={...DEF,...keep,link:S.state.link,seed:Math.floor(Math.random()*1e6)+2};
  const cols=["votes","bingo","spins","feud"];if(mode==="local"||(db&&db.fb))cols.push("capsule");
  if(mode==="local"){S.state=st;for(const c of cols)S[c]={};saveLocal();render();toast("Kõik vastused kustutatud");return}
  for(const c of cols)for(const id of Object.keys(S[c]||{}))write(c+"/"+id,null);
  for(const id of Object.keys(S.gifts||{}))if(id!=="_plan"&&id!=="_codes")write("gifts/"+id,null);
  for(const p of pids())if(p!==me){if(db&&db.fb){const g=guestOf(p);if(g)write("taken/"+g,null)}write("players/"+p,null)}
  for(const c of cols)S[c]={};
  S.state=st;render();write("game/state",S.state);toast("Kõik vastused kustutatud. Mäng on puhas.");
}

function removePlayer(p){ui.confirm=null;if(db&&db.fb){const g=guestOf(p);if(g)write("taken/"+g,null)}for(const c of ["players","votes","feud","bingo","spins"])if(S[c][p])put(c,p,null);if(S.gifts[p]&&p!=="_plan")put("gifts",p,null);if(S.capsule[p]&&mode==="local")put("capsule",p,null)}

function presAwards(){
  const st=S.state,ps=pids(),i=Math.min(st.pa||0,AWARDS.length-1),t=tally(i),n=t.length,step=Math.min(st.ps||0,n);
  if(st.pa>=AWARDS.length)return summaryCard()+(ui.role?`<div class="presctl"><button class="btn ghost" data-act="pa" data-d="-1">‹ Tagasi</button></div>`:"");
  let h=`<section class="card"><div class="row"><p class="eyebrow">Auhinnad · kategooria ${i+1}/${AWARDS.length}</p><span class="spacer"></span><span class="muted">${ps.filter(p=>votedAward(p,i)).length}/${ps.length} hääletanud</span></div><h2>${esc(AWARDS[i])}</h2>`;
  if(step===0){
    h+=`<div class="voters big">${ps.map(p=>`<span class="vt ${votedAward(p,i)?"ok":""}">${bb(p)}${esc(nm(p))}</span>`).join("")}</div><p class="muted">Kuld ääris tähendab, et inimene on selles kategoorias hääletanud. Tulemused avanevad ükshaaval.</p>`;
  }else{
    const max=t[0].n,shown=t.slice(n-step),win=step>=n?t.filter(x=>x.n===max):[];
    if(win.length)h+=`<div class="winner pop"><p class="trophy">Tiitli võitja${win.length>1?"d":""}</p><div class="row" style="justify-content:center;gap:16px">${win.map(x=>cbb(x.p,"lg")).join("")}</div><p class="nm">${win.map(x=>esc(cnm(x.p))).join(" & ")}</p></div>`;
    if(win.length)h+=`<p class="trophy" style="text-align:center">Edetabel</p>`;
    h+=leaderRows(t,shown,!win.length);
  }
  if(!n&&step===0&&ps.some(p=>votedAward(p,i)))h+="";
  h+=`</section>`;
  if(ui.role){
    const main=n===0?`<button class="btn" disabled>Hääli pole veel</button>`:step===0?`<button class="btn" data-act="pstep">Näita tulemusi</button>`:step<n?`<button class="btn" data-act="pstep">Ava järgmine · ${n-step} jäänud</button>`:`<button class="btn" data-act="pa" data-d="1">${i===AWARDS.length-1?"Kokkuvõte":"Järgmine kategooria"}</button>`;
    h+=`<div class="presctl"><button class="btn ghost" data-act="pa" data-d="-1" ${i===0?"disabled":""}>‹ Eelmine</button>${main}<button class="btn ghost" data-act="pa" data-d="1">Järgmine ›</button></div>`;
  }
  return h;
}

/* ---------- wheel ---------- */
function drawWheel(){
  const c=$("#wheel");if(!c)return;
  const size=c.clientWidth||300,dpr=window.devicePixelRatio||1;c.width=size*dpr;c.height=size*dpr;
  const g=c.getContext("2d");g.scale(dpr,dpr);const r=size/2,n=WHEEL.length,seg=2*Math.PI/n;
  const fills=["#692C38","#193C32","#C6AA78","#14213D"],txt=["#F5F0E7","#F5F0E7","#14213D","#F5F0E7"];
  for(let i=0;i<n;i++){const a0=-Math.PI/2+i*seg;g.beginPath();g.moveTo(r,r);g.arc(r,r,r,a0,a0+seg);g.closePath();g.fillStyle=fills[i%4];g.fill();
    g.save();g.translate(r,r);g.rotate(a0+seg/2);g.textAlign="right";g.textBaseline="middle";g.fillStyle=txt[i%4];g.font=`600 ${Math.round(size/22)}px Manrope, system-ui, sans-serif`;g.fillText(WHEEL[i].s,r-14,0);g.restore()}
  g.beginPath();g.arc(r,r,r-1,0,2*Math.PI);g.strokeStyle="rgba(0,0,0,.25)";g.lineWidth=2;g.stroke();
}
function spin(){
  if(ui.spinning)return;
  const n=WHEEL.length,seg=360/n,k=Math.floor(Math.random()*n),jit=(Math.random()-.5)*seg*.6;
  const base=ui.rot-(((ui.rot%360)+360)%360);const target=base+360*(reduced?1:6)+(360-(k+.5)*seg)+jit;
  const c=$("#wheel"),dur=reduced?500:4200;ui.result=null;
  const btn=document.querySelector('[data-act="spin"]');if(btn)btn.disabled=true;
  const res=document.querySelector(".result");if(res)res.remove();
  ui.spinning=true;
  c.style.transition=`transform ${dur}ms cubic-bezier(.12,.7,.08,1)`;requestAnimationFrame(()=>{c.style.transform=`rotate(${target}deg)`});
  setTimeout(()=>{ui.rot=target;ui.spinning=false;ui.result=k;
    const who=actor()||(mode==="local"?"l"+Date.now():null);
    if(mode==="local"){S.spins[who]={r:k,t:Date.now()};const ks=Object.keys(S.spins).sort((a,b)=>S.spins[b].t-S.spins[a].t);ks.slice(8).forEach(x=>delete S.spins[x]);saveLocal()}
    else if(canWrite&&S.players[me])put("spins",me,{r:k,t:Date.now()});
    render()},dur+60);
}

    const g=guests().find(x=>x.id===gid),c=ui.drafts.joincode||"";
    if(!g||(!(db&&db.fb)&&(!g.h||chash(gid,c)!==g.h))){ui.joinErr="See kood ei sobi sellele nimele. Kontrolli koodi või küsi seda Anettilt.";return render()}
    const n=g.name;if(!(db&&db.fb)&&pids().some(p=>p!==me&&S.players[p].active!==false&&(guestOf(p)===gid))){ui.joinErr="Selle nimega on keegi juba liitunud. Kui see oled sina, küsi Anettilt abi.";return render()}
    ui.joinErr=null;const host=!!g.host;if(host){ui.view="host";ui.hostInit=true}
    const pd={name:n.slice(0,24),hue:ui.hue??0,t:Date.now(),host,guest:gid};
    if(db&&db.fb){ui.joining=true;render();db.join(gid,ccode(c),pd).then(()=>location.reload()).catch(e=>{ui.joining=false;const pd2=e&&e.code==="permission-denied";ui.joinErr=(g.h&&chash(gid,c)!==g.h)?"See kood ei sobi sellele nimele. Kontrolli koodi või küsi seda Anettilt.":pd2?"Kood on õige, aga andmebaas ei lase sisse (reeglid). Anna Anettile teada.":"Liitumine ei õnnestunud ("+((e&&e.code)||"viga")+"). Proovi uuesti.";render()});return}
    put("players",me,pd);ui.joinGuest=null;delete ui.drafts.joincode;toast("Tere tulemast, "+n+"!")},
  asklogout:()=>{ui.confirm={logout:true};render()},
  logout:()=>{if(db&&db.fb){db.leave(guestOf(me)).then(()=>location.reload()).catch(()=>toast("Väljalogimine ei õnnestunud. Proovi uuesti."));return}ui.confirm=null;ui.asPlayer=false;ui.hostInit=false;ui.role=false;isHost=false;ui.view="home";ui.drafts={};put("players",me,null);scrollTo({top:0});toast("Oled välja logitud")},
  setview:d=>{const p=d.v==="player";if(p===!!ui.asPlayer)return;ACT.asplayer()},
  asplayer:()=>{ui.asPlayer=!ui.asPlayer;ui.view=ui.asPlayer?(S.state.round!=="home"?S.state.round:"home"):"host";render();scrollTo({top:0})},
  addp:()=>{const n=(ui.drafts.addname||"").trim();if(!n)return;const used=new Set(pids().map(p=>S.players[p].hue));let h=HUES.findIndex((_,i)=>!used.has(i));if(h<0)h=pids().length%HUES.length;
    put("players","p"+Date.now().toString(36)+Math.floor(Math.random()*1e3),{name:n.slice(0,24),hue:h,t:Date.now()});ui.drafts.addname="";render();document.getElementById("addname")?.focus()},
  askrm:d=>{ui.confirm={rm:d.p};render()},
  rm:d=>removePlayer(d.p),
  cancel:()=>{ui.confirm=null;render()},
  askreset:()=>{ui.confirm={reset:true};render()},
  reset:()=>resetGame(),
  mode:()=>switchMode(mode==="shared"?"local":"shared"),
  screen:()=>{location.hash="ekraan"},
  exitscreen:()=>{location.hash="";ui.screen=false;render()},
  savelink:()=>{const v=(ui.drafts.linkin??S.state.link).trim();setState({link:v});toast(v?"QR-kood on valmis":"Link eemaldatud")},
  spot:d=>{spotlight(d.k);if(d.k==="home"&&ui.view!=="host"){ui.view="home"}},
  adv:d=>advance(d.k), back:d=>back(d.k),
  showall:()=>setState({shown:feudBoard(S.state.fq||0).map((_,i)=>i)}),
  slot:d=>{const r=+d.r,sh=[...(S.state.shown||[])];const i=sh.indexOf(r);i<0?sh.push(r):sh.splice(i,1);setState({shown:sh})},
  turn:d=>{ui.turn=d.p;for(const k of Object.keys(ui.drafts))if(/^[qc]\d+$/.test(k))delete ui.drafts[k];render()},
  unturn:()=>{ui.turn=null;render()},
  vote:d=>{const a=actor();if(!a)return;const i=+d.i;if(revd(i))return;const v=JSON.parse(JSON.stringify(S.votes[a]||{}));v.awards={...(v.awards||{}),[i]:d.v};put("votes",a,v)},
  pa:d=>{const i=Math.max(0,Math.min(AWARDS.length,(S.state.pa||0)+(+d.d)));setState({pa:i,ps:0})},
  pstep:()=>{const i=S.state.pa||0,n=tally(i).length,st=(S.state.ps||0)+1,r=[...(S.state.rev||[])];if(st>=n&&!r.includes(i))r.push(i);setState({ps:st,rev:r})},
  fnext:()=>{const b=feudBoard(S.state.fq||0),sh=[...(S.state.shown||[])];for(let r=b.length-1;r>=0;r--){if(!sh.includes(r)){sh.push(r);break}}setState({shown:sh})},
  present:()=>{ui.view="awards";location.hash="ekraan"},
  savefeudq:()=>{const raw=ui.drafts.feudedit??FQ().join("\n");const l=raw.split("\n").map(x=>x.trim().slice(0,140)).filter(Boolean).slice(0,30);
    if(!l.length)return toast("Lisa vähemalt üks küsimus");delete ui.drafts.feudedit;setState({feudList:l,fq:Math.min(S.state.fq||0,l.length-1),shown:[]});toast("Küsimused salvestatud")},
  feuddefault:()=>{delete ui.drafts.feudedit;setState({feudList:null,fq:0,shown:[]});toast("Algsed küsimused taastatud")},
  wadd:()=>{const a=actor();if(!a)return;const t=(ui.drafts.wtext||"").trim();if(!t){toast("Kirjuta soov");document.getElementById("wtext")?.focus();return}
    const items=[...wishItems(a),{id:Date.now().toString(36)+Math.floor(Math.random()*1e3),t:t.slice(0,120),link:(ui.drafts.wlink||"").trim().slice(0,400)}].slice(0,40);
    ui.drafts.wtext="";ui.drafts.wlink="";put("wishes",a,{items});toast("Soov lisatud");setTimeout(()=>document.getElementById("wtext")?.focus(),0)},
  wdel:d=>{const a=actor();if(!a)return;put("wishes",a,{items:wishItems(a).filter(x=>x.id!==d.id)})},
  wclaim:d=>{const a=actor();if(!a||mode!=="shared")return;const c=[...myClaims()],i=c.indexOf(d.k);
    if(i<0){if(claimedBy(d.k))return toast("Keegi juba ostab selle");c.push(d.k)}else c.splice(i,1);put("claims",a,{c})},
  togopen:d=>{const o={...(S.state.opened||{})};o[d.k]=!o[d.k];setState({opened:o});const g=GAMES.find(x=>x.k===d.k);toast(o[d.k]?g.n+" on nüüd kõigile lahti":g.n+" on lukus")},
  savebingo:()=>{const raw=ui.drafts.bingoedit??bingoItems().join("\n");const l=raw.split("\n").map(x=>x.trim().slice(0,70)).filter(Boolean).slice(0,60);
    if(l.length<9)return toast("Bingo jaoks on vaja vähemalt 9 ruutu");delete ui.drafts.bingoedit;resetMarks();setState({bingoList:l});toast("Bingo on uuendatud")},
  bingodefault:()=>{delete ui.drafts.bingoedit;resetMarks();setState({bingoList:null});toast("Algsed ruudud taastatud")},
  rev:d=>{const i=+d.i,r=[...(S.state.rev||[])];const k=r.indexOf(i);k<0?r.push(i):r.splice(k,1);setState({rev:r})},
  savefeud:()=>{const a=actor();if(!a)return;const cur=S.feud[a]?.a||[];const arr=FQ().map((_,i)=>(ui.drafts["q"+i]??cur[i]??"").trim().slice(0,60));
    FQ().forEach((_,i)=>delete ui.drafts["q"+i]);if(mode==="local")ui.turn=null;put("feud",a,{a:arr,t:Date.now()});toast("Vastused salvestatud")},
  savecap:()=>{const a=actor();if(!a)return;const cur=S.capsule[a]?.a||[];const arr=CAPSULE.map((_,i)=>(ui.drafts["c"+i]??cur[i]??"").trim().slice(0,280));
    CAPSULE.forEach((_,i)=>delete ui.drafts["c"+i]);if(mode==="local")ui.turn=null;put("capsule",a,{a:arr,t:Date.now()});toast("Ennustused on kapslis")},
  sq:d=>{const a=actor();if(!a)return;const pos=+d.pos,prev=S.bingo[a]||{m:[],at:null};let m=[...(prev.m||[])];const i=m.indexOf(pos);i<0?m.push(pos):m.splice(i,1);
    const has=bingoLines(m).length>0;const at=has?(prev.at||Date.now()):null;if(has&&!prev.at)toast("BINGO! Hüüa see valjusti välja!");put("bingo",a,{m,at})},
  spin:()=>spin(),
  toastpick:()=>{const ps=pids();if(!ps.length)return;let p=ps[Math.floor(Math.random()*ps.length)];if(ps.length>1&&p===S.state.toast)p=ps[(ps.indexOf(p)+1)%ps.length];setState({toast:p})},
  askcap:()=>{ui.confirm={cap:true};render()},
  capopen:()=>{ui.confirm=null;ui.capView=true;render()},
  capclose:()=>{ui.capView=false;if(S.state.capOpen)setState({capOpen:false});else render()},
  capscreen:()=>setState({capOpen:!S.state.capOpen})
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.tagName==="FORM")return;if(b.tagName==="A")e.preventDefault();const f=ACT[b.dataset.act];if(f)f(b.dataset,b)});
document.addEventListener("submit",e=>{e.preventDefault();const f=ACT[e.target.dataset.act];if(f)f(e.target.dataset,e.target)});
document.addEventListener("change",e=>{const t=e.target;if(!t.dataset)return;
  if(t.dataset.actChange==="assign"){const m={...plan()};if(t.value)m[t.dataset.g]=t.value;else delete m[t.dataset.g];put("gifts","_plan",{map:m});syncGifts()}
  if(t.dataset.actChange==="nogift"){const gs=guests().map(g=>g.id===t.dataset.g?{...g,noGift:!t.checked}:g);setState({guests:gs})}});
document.addEventListener("input",e=>{if(e.target.id)ui.drafts[e.target.id]=e.target.value;if(e.target.id==="joinname"){const b=document.querySelector(".joinbb .bb");if(b)b.textContent=(e.target.value.trim()[0]||"?").toUpperCase()}});
addEventListener("hashchange",()=>{ui.screen=location.hash==="#ekraan";render()});

/* ---------- boot ---------- */
(function(){const cs=["#C6AA78","#b9505f","#F5F0E7","#6fa58b"];let h=`<path d="M0 6 Q50 34 100 8 T200 8 T300 8 T400 6" fill="none" stroke="#C6AA78" stroke-opacity=".55" stroke-width="1"/>`;
  for(let i=0;i<20;i++){const x=10+i*20,t=(x%100)/100,y=7+26*4*t*(1-t)*.9+3;h+=`<line x1="${x}" y1="${y-4}" x2="${x}" y2="${y}" stroke="#C6AA78" stroke-opacity=".5"/><circle cx="${x}" cy="${y+3}" r="3.2" fill="${cs[i%4]}" style="animation-delay:${(i*.37)%2.6}s;filter:drop-shadow(0 0 3px ${cs[i%4]})"/>`}
  $("#garland").innerHTML=h})();
(async function(){
  try{if(window.claude&&claude.use){db=await claude.use("db");user=await claude.use("user")}}catch(e){db=null}
  dbAvail=!!(db&&user);
  if(dbAvail&&lsGet("cc_mode")!=="local")await startShared();else startLocal();
})();
</script>
